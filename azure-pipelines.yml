# Azure DevOps Pipeline - Spring Boot with Maven Build

trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'acr-service-connection'
  imageRepository: 'springboot-app'
  containerRegistry: 'mithspringbootacr.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  
  # Maven settings
  mavenPOMFile: 'pom.xml'
  jdkVersion: '21'  # Change to 11 or 21 if needed

stages:
- stage: Build
  displayName: 'Build Application'
  jobs:
  - job: MavenBuild
    displayName: 'Maven Build'
    steps:
    
    # Checkout code
    - checkout: self
      displayName: 'Checkout Source Code'
    
    # Setup Java
    - task: JavaToolInstaller@0
      displayName: 'Setup JDK $(jdkVersion)'
      inputs:
        versionSpec: '$(jdkVersion)'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'
    
    # Maven Build
    - task: Maven@3
      displayName: 'Maven Clean Package'
      inputs:
        mavenPomFile: '$(mavenPOMFile)'
        goals: 'clean package'
        options: '-DskipTests=false'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '$(jdkVersion)'
        mavenVersionOption: 'Default'
    
    # Copy JAR for Docker build
    - task: CopyFiles@2
      displayName: 'Copy JAR to Staging'
      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)/target'
        Contents: '*.jar'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
    
    # Publish artifact for next stage
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'

- stage: Docker
  displayName: 'Build and Push Docker Image'
  dependsOn: Build
  jobs:
  - job: DockerBuildPush
    displayName: 'Docker Build and Push'
    steps:
    
    # Checkout for Dockerfile
    - checkout: self
      displayName: 'Checkout Source Code'
    
    # Download artifacts from Build stage
    - task: DownloadBuildArtifacts@0
      displayName: 'Download Build Artifacts'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.DefaultWorkingDirectory)'
    
    # Build and Push Docker Image
    - task: Docker@2
      displayName: 'Build and Push to ACR'
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        command: 'buildAndPush'
        Dockerfile: '$(dockerfilePath)'
        buildContext: '$(System.DefaultWorkingDirectory)'
        tags: |
          $(tag)
          latest
          v1.0.$(Build.BuildId)
    
    # Display success message
    - script: |
        echo "======================================"
        echo "Docker Image Push Successful!"
        echo "======================================"
        echo "Image: $(containerRegistry)/$(imageRepository):$(tag)"
        echo "Image: $(containerRegistry)/$(imageRepository):latest"
        echo "======================================"
      displayName: 'Success Message'
