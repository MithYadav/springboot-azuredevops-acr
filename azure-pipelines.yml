# Azure DevOps Pipeline - Spring Boot Docker Deployment to Azure Web App

trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:

  # Docker / ACR Configuration
  dockerRegistryServiceConnection: 'acr-service-connection'
  containerRegistry: 'mithspringbootacr.azurecr.io'
  imageRepository: 'springboot-app'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # Azure Web App Configuration
  azureSubscription: 'azure-service-connection'
  webAppName: 'springboot-app-yadav'

  # Maven / Java Configuration
  mavenPOMFile: 'pom.xml'
  jdkVersion: '21'

stages:

# =========================================================
# STAGE 1 - BUILD APPLICATION
# =========================================================
- stage: Build
  displayName: 'Build Spring Boot Application'

  jobs:
  - job: MavenBuild
    displayName: 'Maven Build Job'

    steps:

    # Checkout source code
    - checkout: self
      displayName: 'Checkout Source Code'

    # Install Java
    - task: JavaToolInstaller@0
      displayName: 'Setup JDK $(jdkVersion)'

      inputs:
        versionSpec: '$(jdkVersion)'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    # Maven Build
    - task: Maven@3
      displayName: 'Maven Clean Package'

      inputs:
        mavenPomFile: '$(mavenPOMFile)'
        goals: 'clean package'
        options: '-DskipTests'
        publishJUnitResults: false
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '$(jdkVersion)'
        mavenVersionOption: 'Default'

    # Verify JAR generated
    - script: |
        echo "Listing target directory"
        ls -la target
      displayName: 'Verify JAR File'


# =========================================================
# STAGE 2 - BUILD & PUSH DOCKER IMAGE
# =========================================================
- stage: Docker
  displayName: 'Build and Push Docker Image'

  dependsOn: Build

  jobs:
  - job: DockerBuildPush
    displayName: 'Docker Build and Push Job'

    steps:

    # Checkout source code
    - checkout: self
      displayName: 'Checkout Source Code'

    # Build and Push Docker Image to ACR
    - task: Docker@2
      displayName: 'Build and Push Docker Image'

      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        command: 'buildAndPush'
        Dockerfile: '$(dockerfilePath)'
        buildContext: '$(Build.SourcesDirectory)'

        tags: |
          $(tag)
          latest

    # Display image info
    - script: |
        echo "======================================"
        echo "Docker Image Push Successful"
        echo "======================================"
        echo "Image:"
        echo "$(containerRegistry)/$(imageRepository):$(tag)"
        echo ""
        echo "Latest:"
        echo "$(containerRegistry)/$(imageRepository):latest"
        echo "======================================"

      displayName: 'Display Docker Image Info'


# =========================================================
# STAGE 3 - DEPLOY TO AZURE WEB APP
# =========================================================
- stage: Deploy
  displayName: 'Deploy to Azure Web App'

  dependsOn: Docker

  jobs:
  - deployment: DeployWebApp
    displayName: 'Deploy Container to Azure Web App'

    environment: 'production'

    strategy:
      runOnce:
        deploy:

          steps:

          # Deploy Container to Azure Web App
          - task: AzureWebAppContainer@1
            displayName: 'Deploy to Azure Web App'

            inputs:
              azureSubscription: '$(azureSubscription)'
              appName: '$(webAppName)'

              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)

          # Deployment Success Message
          - script: |
              echo "======================================"
              echo "Deployment Successful"
              echo "======================================"
              echo "Web App:"
              echo "https://$(webAppName).azurewebsites.net"
              echo "======================================"

            displayName: 'Deployment Success Message'
